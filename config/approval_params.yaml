approval_node:
  ros__parameters:
    # HTTP + WebSocket server the ground station connects to. 0.0.0.0 so any host
    # on the Herelink WiFi can reach it.
    ws_host: '0.0.0.0'
    ws_port: 8765

    # Rate at which drone position is pushed to connected browsers. MAVROS publishes
    # far faster than a constrained radio link should carry.
    gps_broadcast_hz: 1.0

    # How many recent annotated crops to keep in memory for GET /frame/<id>.
    frame_cache_size: 8

    # Source frame dimensions that /obj_dets centres are expressed in. Real camera
    # is 4640x3480; set to 1280x720 when running against Gazebo, or markers will
    # land in the wrong place on the video overlay. Width and height are separate
    # on purpose — the two cameras have different aspect ratios (4:3 vs 16:9), so
    # deriving one from the other would misplace every marker vertically.
    detection_source_width: 4640
    detection_source_height: 3480

# NOTE: the approval timeout is deliberately NOT configured here. mission_node owns
# it (Approval_timeout_sec in bv_core/config/mission_params.yaml) so the aircraft
# still recovers if this process or the radio link dies.
